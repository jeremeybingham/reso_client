# cargo-deny configuration (CI job "Supply chain"; run locally with
# `cargo deny --workspace --all-features check`). See SECURITY.md.

[graph]
all-features = true

[advisories]
# Unmaintained crates fail the check only when a workspace crate depends on them
# directly (cargo-deny's default, written out). Transitive ones, such as chrono
# and humantime under arrow/object_store (#51), are reported by the cargo-audit
# job and ignored there in .cargo/audit.toml.
unmaintained = "workspace"

[licenses]
# Permissive licences only. A new dependency under any other licence fails the
# check and needs the owner's go-ahead before it is added here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common in the arrow/object_store tree;
# report them, do not fail.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
