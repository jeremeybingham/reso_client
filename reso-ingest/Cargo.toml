[package]
name = "reso-ingest"
version = "0.0.1"
edition = "2021"
rust-version = "1.87.0"
description = "Ingest layer over reso-client: multi-server configuration and runs"
license = "MIT"
repository = "https://github.com/jeremeybingham/reso_client"
publish = false

[dependencies]
reso-client = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
clap = { version = "4.6.10", features = ["derive"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "reso-ingest"
path = "src/main.rs"
