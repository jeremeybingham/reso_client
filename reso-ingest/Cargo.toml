[package]
name = "reso-ingest"
version = "0.0.1"
edition = "2021"
rust-version = "1.87.0"
description = "Ingest layer over reso-client: multi-server configuration and runs"
license = "MIT"
repository = "https://github.com/jeremeybingham/reso_client"
publish = false

[dependencies]
reso-client = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "fs", "io-util"] }
tracing = "0.1"
# Log output of the binary (text or JSON lines on stderr, level from RUST_LOG)
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }  # webhook POST; the client crate already depends on it
# `serve` endpoints (health, readiness, metrics, status); HTTP/1 only
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
# SHA-256 of purge records (#93)
sha2 = "0.10"
# Parquet output (optional feature `parquet`); the client crate does not depend on these
arrow-array = { version = "60", optional = true }
arrow-json = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"], optional = true }
# S3-compatible object storage and native GCS (optional feature `s3`)
object_store = { version = "0.14", default-features = false, features = ["aws", "gcp"], optional = true }
futures = { version = "0.3", default-features = false, optional = true }

[features]
default = []
# Write Parquet files (`ParquetWriter`, `reso-ingest sync --format parquet`)
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-json", "dep:arrow-schema"]
# Object storage for state and output: S3-compatible (AWS S3, R2, MinIO, RustFS) and native GCS; `object_store` with rustls, no OpenSSL
s3 = ["dep:object_store", "dep:futures"]

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "reso-ingest"
path = "src/main.rs"
