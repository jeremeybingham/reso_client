# Example reso-ingest configuration: two servers.
# Secrets are never written here: `*_env` keys name the environment variable that holds the value, or
# `*_file` keys a file that holds it (re-read before each resource, so a rotated file needs no restart).
# Copy this file, edit it, and export the variables before running.

# Most servers running at the same time (default 4)
max_concurrent_servers = 2

# Variable holding a URL that gets the run summary as JSON when a run ends (optional)
# webhook_url_env = "RESO_WEBHOOK"

# A vendor server with OAuth2 client credentials
[[server]]
name = "mls-one"
base_url = "https://api.mls-one.example/odata"
page_size = 1000
timeout_secs = 60
include = ["Property", "Member", "Office"]   # empty or absent = every resource
exclude = ["OpenHouse"]                      # wins over include
# filter = "OriginatingSystemName eq 'mls'"  # added to every query (some servers require one)
# deletes = { flag_field = "MlgCanView" }    # a record with this field false is deleted (MLS Grid)
# deletes = { max_deletes = 5000, max_percent = 20 }   # hold a --deletes pass over these limits for review
# interval = "1h"                            # `serve` only: how often to sync included resources with no interval of their own
# concurrency = 2                            # `serve` only: feeds of this server syncing at once

# Settings for one resource (optional)
# [server.resources.Property]
# filter = "PropertyType eq 'Residential'"   # ANDed with the server filter
# expand = ["Media"]                         # $expand on sync pulls
# page_size = 1000                           # overrides the server's
# interval = "2m"                            # `serve` only: how often to sync this resource

[server.auth]
type = "client_credentials"
token_url = "https://auth.mls-one.example/oauth/token"
client_id_env = "MLS_ONE_CLIENT_ID"
client_secret_env = "MLS_ONE_CLIENT_SECRET"   # or client_secret_file = "/run/secrets/mls-one"
scope = "api"
transport = "body"                           # body (default), header or query

[server.limits]
max_retries = 4
initial_backoff_ms = 500
max_backoff_ms = 30000
per_second = 2
per_hour = 5000
per_day = 40000
bytes_per_hour = 4000000000
bytes_per_day = 5000000000

# A server with a static bearer token and a dataset id
[[server]]
name = "mls-two"
base_url = "https://api.mls-two.example/api/v2/OData"
dataset_id = "ref_data"

[server.auth]
type = "bearer"
token_env = "MLS_TWO_TOKEN"

# Media file downloads (`reso-ingest media` and `sync --media`): their own limits, separate from the API's
[server.media]
per_second = 4
bytes_per_day = 50000000000                  # also per_hour, per_day, bytes_per_hour
timeout_secs = 300
send_token = "same_host"                     # never, same_host (default) or always
# nested_field = "Media"                     # `sync --media`: array of media records inside a record
