name: Container

# Builds the reso-ingest image and checks it runs. Nothing is pushed to a registry:
# publishing an image is a release action (the owner's call).
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - .github/workflows/container.yml
  workflow_dispatch:

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: reso-ingest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The base image is empty (no libc, no shell): running the binary proves it is fully static
      - name: Run the binary
        run: |
          docker run --rm reso-ingest:ci --version
          docker run --rm reso-ingest:ci sync --help > /dev/null
          docker image ls reso-ingest:ci

      - name: Check the Kubernetes examples parse
        run: |
          for f in deploy/kubernetes/*.yaml; do
            python3 -c 'import sys, yaml; list(yaml.safe_load_all(open(sys.argv[1])))' "$f"
          done
