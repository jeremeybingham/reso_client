# Prometheus + Grafana for one `reso-ingest serve`, with Docker (see README.md).
#
#   docker compose -f deploy/observability/compose.yaml up -d
#
# Host networking (Linux): both listen on loopback, as with setup.sh, and Prometheus reaches
# `serve` on 127.0.0.1:9090. Prometheus on 127.0.0.1:9190, Grafana on 127.0.0.1:3000.
name: reso-observability

services:
  prometheus:
    image: prom/prometheus:v3.16.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9190
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../../reso-ingest/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.2
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      # Loopback only: anyone on this machine can view; sign in as admin (password admin at first) to edit
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      RESO_DASHBOARDS: /etc/reso-dashboards
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/reso-dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
