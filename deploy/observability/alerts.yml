# Prometheus alert rules for `reso-ingest serve` (feeds on intervals). The rules for every run's
# results (stale feeds, failed resources, held deletes...) are in reso-ingest/monitoring/alert-rules.yml.
# Thresholds are starting points. Runbooks: docs/OPERATIONS.md.
groups:
  - name: reso-ingest-serve
    rules:
      - alert: ResoServeDown
        # Prometheus cannot scrape the daemon: it stopped, or --listen changed
        expr: up{job="reso-ingest"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "reso-ingest serve at {{ $labels.instance }} cannot be scraped"
          runbook_url: "https://github.com/jeremeybingham/reso-rs/blob/main/docs/OPERATIONS.md#resoservedown"

      - alert: ResoFeedFailing
        # Three syncs in a row failed (the feed backs off, doubling its wait up to 15 minutes)
        expr: reso_ingest_feed_consecutive_failures >= 3
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.server }}/{{ $labels.resource }} failed {{ $value }} times in a row"
          runbook_url: "https://github.com/jeremeybingham/reso-rs/blob/main/docs/OPERATIONS.md#resofeedfailing"

      - alert: ResoFeedNoSuccess
        # No successful sync for three intervals plus 10 minutes, and the feed is not paused. A feed
        # that has not succeeded once since the daemon started has no sample: ResoFeedFailing covers it.
        expr: |
          time() - reso_ingest_feed_last_success_timestamp_seconds
            > 3 * reso_ingest_feed_interval_seconds + 600
          unless on (server, resource) reso_ingest_feed_paused == 1
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.server }}/{{ $labels.resource }} has not synced for {{ $value | humanizeDuration }}"
          runbook_url: "https://github.com/jeremeybingham/reso-rs/blob/main/docs/OPERATIONS.md#resofeednosuccess"

      - alert: ResoRateLimitHigh
        # A server's client used over 90% of a rate-limit window for 15 minutes
        expr: reso_ingest_rate_limit_used / reso_ingest_rate_limit > 0.9
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.server }} uses {{ $value | humanizePercentage }} of its {{ $labels.window }} {{ $labels.unit }} limit"
          runbook_url: "https://github.com/jeremeybingham/reso-rs/blob/main/docs/OPERATIONS.md#resoratelimithigh"
