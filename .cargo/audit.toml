# cargo-audit configuration (also read by the CI Security Audit job).

[advisories]
ignore = [
    # chrono is unmaintained. It reaches us only through arrow/parquet in
    # reso-ingest's optional `parquet` feature; neither crate uses it directly.
    # Remove this entry once an arrow/parquet release drops chrono
    # (apache/arrow-rs#9183) and `cargo tree -i chrono --workspace --all-features`
    # comes back empty.
    # https://github.com/jeremeybingham/reso-rs/issues/51
    "RUSTSEC-2026-0543",
]
