# Cargo.toml

[workspace]
members = [".", "reso-ingest"]
# plain `cargo test` / `cargo clippy` cover both crates
default-members = [".", "reso-ingest"]

[package]
name = "reso-client"
version = "0.3.0"
edition = "2021"
rust-version = "1.87.0"
authors = ["Jeremey Bingham <jeremeybingham@gh-email.com>"]
description = "Rust client library for RESO Web API (OData 4.0) servers"
license = "MIT"
repository = "https://github.com/jeremeybingham/reso_client"
documentation = "https://docs.rs/reso-client"
readme = "README.md"
keywords = ["reso", "odata", "real-estate", "mls", "api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [
    ".github/",
    "reso-ingest/",
    ".gitignore",
    "*.json",
    "dev_summary.md",
    ".env*",
]

[lib]
name = "reso_client"
path = "src/lib.rs"

[dependencies]
# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error Handling
thiserror = "1"

# Logging
tracing = "0.1"

# URL handling
urlencoding = "2"
roxmltree = "0.21.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tokio-test = "0.4"
wiremock = "0.6"
serial_test = "3.0"
# TLS test server for the extra-CA test (#91); already in the tree through reqwest
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
